services:
  - type: web
    name: factory-ppe-ai
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python download_models.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: EMAIL_ENABLED
        value: "false"
